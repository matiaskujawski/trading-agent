name: Vigía de volatilidad

"on":
  schedule:
    - cron: "0 */2 * * *"  # cada 2 horas
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_shock_watchdog.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Guardar el estado actualizado (si cambió algo)
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_trading/
          git diff --staged --quiet || git commit -m "Vigía de shocks: $(date -u +%Y-%m-%dT%H:%M)"
          git push
